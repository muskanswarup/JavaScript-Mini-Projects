<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Quiz?!</title>
    <link rel="stylesheet" href="play.css">
</head>
<body>
    <div id="container">
        <!-- This div is for stopwatch and or progress bar. -->
        <div>
            <h1>Bruh? Are you working?</h1>
        </div>

        <div class="quiz-box">
            <div class="left-side">
                <img id="monitor-screen" src="./images/monitor-removebg-preview.png" alt="computer_monitor">
            <span id="monitor-text"> The moon is a <br> planet? True or <br> false</span>
            </div>
            <div class="right-side">
                <div class="pencil-wrapper">
                    <img src="./images/perfect_pencil.png" alt="True Pencil">
                    <span class="pencil-text">True</span>
                </div>
                <div class="pencil-wrapper">
                    <img src="./images/perfect_pencil.png" alt="False Pencil">
                    <span class="pencil-text">False</span>
                </div>
            </div>
        </div>

       

    </div>
</body>
</html>
