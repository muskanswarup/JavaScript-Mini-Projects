<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">

     <div id="top-moving-line"></div>
     <img src="./images/light-bulb.png" alt="light-bulb" id="light-bulb"/>
     <img src="./images/qa.png" alt="question-ans" id="qa-image">
      <div id="quiz-text">
        <h3>Quiz</h3>
        <h1>ANIMATED</h1>
        <h1>CHALKBOARD </h1>
      </div>
      <img src="./images/question-mark-rev.png" id="qa-image-reverse" alt="reverse question mark">
      <div id="bottom-moving-line"></div>

      <div>
        <img src="./images/shrug.png"/ alt="shrug" id="shrug">
        <button id="play-btn"><a href="./play.html" target="_blank"> Play?!!</a></button>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
