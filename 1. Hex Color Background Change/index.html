<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex color background change</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="container">
        <h1>Enter hex color: </h1>
        <input type="text" id="input-hex-code" name="hex-code" placeholder="#FFFFFF" maxlength="7" minlength="6" title="Enter a hex color code (e.g., #FFFFFF or FFFFFF)">
        <button id="button" name="button" onclick="printInput()">Change color</button>
        <p id="current-color">Background color: Default</p>

        <span id="alert-text"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
