<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div>
      <h1 id="main-heading">Snake Game</h1>
      <div class="buttons">
        <button>Reset</button>
        <button>Pause</button>
      </div>
      <div class="scores">
        <span id="score"> 000</span>
        <span id="high-score"> 000</span>
      </div>

      <div class="game-border-1">
        <div class="game-border-2">
          <div class="game-border-3">
            <div id="game-board"></div>
          </div>
        </div>
      </div>

      <h1 id="instruction-text">Press spacebar to start the game.</h1>
      <img src="snake-game-ai-gen.png" alt="snake-logo" id="logo" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
